# Edge reverse proxy: / -> frontend, /api -> backend
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  client_max_body_size 30m;            # audio uploads (backend enforces MAX_AUDIO_MB)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream backend  { server backend:4000; }
  upstream frontend { server frontend:80; }

  server {
    listen 80;
    # For production, terminate TLS here (listen 443 ssl) and redirect 80 -> 443.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_request_buffering on;
    }
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
